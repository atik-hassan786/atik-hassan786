<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b10" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#0b0b10"/>

    <!-- moving glows -->
    <g filter="url(#blur)">
      <circle r="130" fill="#FF2D20" fill-opacity="0.55">
        <animate attributeName="cx" values="200;520;300;200" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;260;300;120" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="110" fill="#FF7A1A" fill-opacity="0.45">
        <animate attributeName="cx" values="900;700;1000;900" dur="17s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="260;100;180;260" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle r="100" fill="#B5179E" fill-opacity="0.35">
        <animate attributeName="cx" values="600;850;450;600" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="40;150;60;40" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- grid -->
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#fade)"/>

    <!-- text -->
    <text x="600" y="165" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" opacity="0">
      Hi, I'm Atik Hassan 👋
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="600" y="220" text-anchor="middle" fill="#FF6B5E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" opacity="0">
      Student &amp; Developer from Bangladesh
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
