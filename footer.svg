<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D20" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF2D20"/>
      <stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="140" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="140" fill="#0b0b10"/>
    <g filter="url(#blur)">
      <circle r="70" fill="#FF2D20" fill-opacity="0.5">
        <animate attributeName="cx" values="250;700;250" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="140;120;140" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="60" fill="#FF7A1A" fill-opacity="0.4">
        <animate attributeName="cx" values="950;500;950" dur="15s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="130;150;130" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="0" y="0" width="1200" height="2" fill="url(#line)"/>
    <text x="600" y="78" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
      Thanks for visiting my profile!
    </text>
    <text x="600" y="108" text-anchor="middle" fill="#FF6B5E" font-family="Fira Code, Consolas, monospace" font-size="16">
      keep coding. keep building.
    </text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
