<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D20"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="230" rx="16" fill="#0b0b10"/>
  <rect x="0.5" y="0.5" width="799" height="229" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="40" y="42" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">My Skill Ranking</text>

  <!-- Rank 1: HTML (80%) -->
  <text x="40" y="95" fill="#FF6B5E" font-family="Fira Code, Consolas, monospace" font-size="16" font-weight="700">#1</text>
  <text x="80" y="95" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">Python</text>
  <rect x="220" y="80" width="480" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="220" y="80" width="0" height="14" rx="7" fill="url(#bar)">
    <animate attributeName="width" from="0" to="384" dur="1.5s" fill="freeze"/>
  </rect>
  <text x="720" y="93" fill="#ffffff" font-family="Fira Code, Consolas, monospace" font-size="14">80%</text>

  <!-- Rank 2: JavaScript (60%) -->
  <text x="40" y="145" fill="#FF6B5E" font-family="Fira Code, Consolas, monospace" font-size="16" font-weight="700">#2</text>
  <text x="80" y="145" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">JavaScript</text>
  <rect x="220" y="130" width="480" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="220" y="130" width="0" height="14" rx="7" fill="url(#bar)">
    <animate attributeName="width" from="0" to="288" dur="1.5s" begin="0.3s" fill="freeze"/>
  </rect>
  <text x="720" y="143" fill="#ffffff" font-family="Fira Code, Consolas, monospace" font-size="14">60%</text>

  <!-- Rank 3: Python (50%) -->
  <text x="40" y="195" fill="#FF6B5E" font-family="Fira Code, Consolas, monospace" font-size="16" font-weight="700">#3</text>
  <text x="80" y="195" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">HTML</text>
  <rect x="220" y="180" width="480" height="14" rx="7" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="220" y="180" width="0" height="14" rx="7" fill="url(#bar)">
    <animate attributeName="width" from="0" to="240" dur="1.5s" begin="0.6s" fill="freeze"/>
  </rect>
  <text x="720" y="193" fill="#ffffff" font-family="Fira Code, Consolas, monospace" font-size="14">50%</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
